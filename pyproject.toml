[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rssdpy"
version = "0.1.0"
description = "Response Surface Sampling Design (RSSD) for ECa-directed soil salinity sampling"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Amninder Singh", email = "asing075@ucr.edu" }]
keywords = ["soil salinity", "EMI", "sampling design", "RSSD", "ESAP", "precision agriculture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyproj>=3.6",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "statsmodels>=0.14",
]

[project.urls]
Homepage = "https://github.com/singhamninder/RSSDpy"
Repository = "https://github.com/singhamninder/RSSDpy"
Issues = "https://github.com/singhamninder/RSSDpy/issues"

[project.optional-dependencies]
notebook = [
    "geopandas>=1.0",
    "contextily>=1.6",
    "ipykernel>=7.2.0",
]
app = [
    "streamlit>=1.40",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rssdpy"]

[tool.hatch.build.targets.sdist]
# Keep the sdist to the package + tests (+ the fixture data tests/test_esap_parity.py
# needs to run standalone) + top-level docs; exclude dev-tool config and notebooks.
include = [
    "src/rssdpy",
    "tests",
    "examples/data",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb", "notebooks/*.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "N",   # pep8-naming
    "NPY", # numpy-specific
    "PD",  # pandas-vet
]
ignore = ["PD101"]

[tool.ruff.lint.isort]
known-first-party = ["rssdpy"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
# Publish-only: never used for dependency resolution during `uv sync`/`uv lock`.
explicit = true

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pre-commit>=4.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "ty>=0.0.1a14",
]
