name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev --python ${{ matrix.python-version }}

      - name: Ruff format
        run: uv run ruff format --check src tests app

      - name: Ruff lint
        run: uv run ruff check src tests app

      - name: Type check
        run: uv run ty check src tests app

      - name: Tests
        run: uv run pytest --cov=rssdpy --cov-report=term-missing --cov-fail-under=85

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke-test wheel import (isolated)
        run: uv run --with "$(ls dist/*.whl)" --no-project -- python -c "import rssdpy; print(rssdpy.__version__)"

      - name: Smoke-test sdist import (isolated)
        run: uv run --with "$(ls dist/*.tar.gz)" --no-project -- python -c "import rssdpy; print(rssdpy.__version__)"
